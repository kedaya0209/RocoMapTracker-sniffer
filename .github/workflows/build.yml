name: Build RocoMapTracker-sniffer

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-jar:
    name: Build fat jar
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: graalvm

      - name: Configure Maven for GitHub Packages
        shell: bash
        run: |
          mkdir -p ~/.m2
          echo '<?xml version="1.0" encoding="UTF-8"?>' > ~/.m2/settings.xml
          echo '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"' >> ~/.m2/settings.xml
          echo '  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"' >> ~/.m2/settings.xml
          echo '  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">' >> ~/.m2/settings.xml
          echo '  <servers>' >> ~/.m2/settings.xml
          echo '    <server>' >> ~/.m2/settings.xml
          echo '      <id>github</id>' >> ~/.m2/settings.xml
          echo "      <username>kedaya0209</username>" >> ~/.m2/settings.xml
          echo "      <password>${{ secrets.GH_PACKAGES_TOKEN }}</password>" >> ~/.m2/settings.xml
          echo '    </server>' >> ~/.m2/settings.xml
          echo '  </servers>' >> ~/.m2/settings.xml
          echo '</settings>' >> ~/.m2/settings.xml
          cat ~/.m2/settings.xml

      - name: Manually install roco-common from GitHub Packages
        shell: bash
        run: |
          AUTH="kedaya0209:${{ secrets.GH_PACKAGES_TOKEN }}"
          BASE="https://maven.pkg.github.com/kedaya0209/RocoMapTracker"

          # Install parent POM (roco-map-tracker)
          PARENT_PATH="$HOME/.m2/repository/io/github/kedaya0209/roco-map-tracker/1.2.0"
          mkdir -p "$PARENT_PATH"
          curl -fL -u "$AUTH" \
            "$BASE/io/github/kedaya0209/roco-map-tracker/1.2.0/roco-map-tracker-1.2.0.pom" \
            -o "$PARENT_PATH/roco-map-tracker-1.2.0.pom"
          echo "Parent POM downloaded OK"

          # Install roco-common (JAR + POM)
          COMMON_PATH="$HOME/.m2/repository/io/github/kedaya0209/roco-common/1.2.0"
          mkdir -p "$COMMON_PATH"
          curl -fL -u "$AUTH" \
            "$BASE/io/github/kedaya0209/roco-common/1.2.0/roco-common-1.2.0.pom" \
            -o "$COMMON_PATH/roco-common-1.2.0.pom"
          echo "roco-common POM downloaded OK"
          curl -fL -u "$AUTH" \
            "$BASE/io/github/kedaya0209/roco-common/1.2.0/roco-common-1.2.0.jar" \
            -o "$COMMON_PATH/roco-common-1.2.0.jar"
          echo "roco-common JAR downloaded OK"

          # Mark as local so Maven skips remote re-resolution
          for DIR in "$PARENT_PATH" "$COMMON_PATH"; do
            {
              echo "#Maven Resolver internal file"
              for f in "$DIR"/*.pom "$DIR"/*.jar; do
                [ -f "$f" ] && echo "$(basename "$f")>=local"
              done
            } > "$DIR/_remote.repositories"
          done

          echo "=== roco-map-tracker ==="
          ls -la "$PARENT_PATH/"
          echo "=== roco-common ==="
          ls -la "$COMMON_PATH/"

      - name: Setup Visual Studio (rc.exe)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Upload fat jar
        uses: actions/upload-artifact@v4
        with:
          name: RocoMapTracker-sniffer-jar
          path: target/RocoMapTracker-sniffer-*.jar
          compression-level: 0

  native-image:
    name: Build native image
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: graalvm

      - name: Configure Maven for GitHub Packages
        shell: bash
        run: |
          mkdir -p ~/.m2
          echo '<?xml version="1.0" encoding="UTF-8"?>' > ~/.m2/settings.xml
          echo '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"' >> ~/.m2/settings.xml
          echo '  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"' >> ~/.m2/settings.xml
          echo '  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">' >> ~/.m2/settings.xml
          echo '  <servers>' >> ~/.m2/settings.xml
          echo '    <server>' >> ~/.m2/settings.xml
          echo '      <id>github</id>' >> ~/.m2/settings.xml
          echo "      <username>kedaya0209</username>" >> ~/.m2/settings.xml
          echo "      <password>${{ secrets.GH_PACKAGES_TOKEN }}</password>" >> ~/.m2/settings.xml
          echo '    </server>' >> ~/.m2/settings.xml
          echo '  </servers>' >> ~/.m2/settings.xml
          echo '</settings>' >> ~/.m2/settings.xml
          cat ~/.m2/settings.xml

      - name: Manually install roco-common from GitHub Packages
        shell: bash
        run: |
          AUTH="kedaya0209:${{ secrets.GH_PACKAGES_TOKEN }}"
          BASE="https://maven.pkg.github.com/kedaya0209/RocoMapTracker"

          # Install parent POM (roco-map-tracker)
          PARENT_PATH="$HOME/.m2/repository/io/github/kedaya0209/roco-map-tracker/1.2.0"
          mkdir -p "$PARENT_PATH"
          curl -fL -u "$AUTH" \
            "$BASE/io/github/kedaya0209/roco-map-tracker/1.2.0/roco-map-tracker-1.2.0.pom" \
            -o "$PARENT_PATH/roco-map-tracker-1.2.0.pom"
          echo "Parent POM downloaded OK"

          # Install roco-common (JAR + POM)
          COMMON_PATH="$HOME/.m2/repository/io/github/kedaya0209/roco-common/1.2.0"
          mkdir -p "$COMMON_PATH"
          curl -fL -u "$AUTH" \
            "$BASE/io/github/kedaya0209/roco-common/1.2.0/roco-common-1.2.0.pom" \
            -o "$COMMON_PATH/roco-common-1.2.0.pom"
          echo "roco-common POM downloaded OK"
          curl -fL -u "$AUTH" \
            "$BASE/io/github/kedaya0209/roco-common/1.2.0/roco-common-1.2.0.jar" \
            -o "$COMMON_PATH/roco-common-1.2.0.jar"
          echo "roco-common JAR downloaded OK"

          # Mark as local so Maven skips remote re-resolution
          for DIR in "$PARENT_PATH" "$COMMON_PATH"; do
            {
              echo "#Maven Resolver internal file"
              for f in "$DIR"/*.pom "$DIR"/*.jar; do
                [ -f "$f" ] && echo "$(basename "$f")>=local"
              done
            } > "$DIR/_remote.repositories"
          done

          echo "=== roco-map-tracker ==="
          ls -la "$PARENT_PATH/"
          echo "=== roco-common ==="
          ls -la "$COMMON_PATH/"

      - name: Setup Visual Studio (rc.exe + linker)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native image
        run: mvn native:compile -DskipTests -B -V

      - name: Upload native image
        uses: actions/upload-artifact@v4
        with:
          name: RocoMapTracker-sniffer.exe
          path: target/RocoMapTracker-sniffer.exe
          compression-level: 0

      - name: Upload native image to release
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const exePath = path.join(process.env.GITHUB_WORKSPACE, 'target', 'RocoMapTracker-sniffer.exe');
            if (!fs.existsSync(exePath)) {
              core.error('Native image not found at ' + exePath);
              process.exit(1);
            }
            const asset = await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              name: 'RocoMapTracker-sniffer.exe',
              data: fs.readFileSync(exePath),
            });
            core.info('Uploaded asset: ' + asset.data.name);
