name: Build RocoMapTracker-sniffer

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-jar:
    name: Build fat jar
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: graalvm

      - name: Create Maven settings.xml for GitHub Packages
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ secrets.GH_PACKAGES_USER }}</username>
                <password>${{ secrets.GH_PACKAGES_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
          echo "=== settings.xml (password hidden) ==="
          sed 's/<password>.*<\/password>/<password>***<\/password>/' ~/.m2/settings.xml

      - name: Install parent POM stub (roco-map-tracker) to local repo
        shell: bash
        run: |
          cat > /tmp/roco-map-tracker-1.2.0.pom << 'POMEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>io.github.kedaya0209</groupId>
              <artifactId>roco-map-tracker</artifactId>
              <version>1.2.0</version>
              <packaging>pom</packaging>
          </project>
          POMEOF
          mvn install:install-file \
            -Dfile=/tmp/roco-map-tracker-1.2.0.pom \
            -DgroupId=io.github.kedaya0209 \
            -DartifactId=roco-map-tracker \
            -Dversion=1.2.0 \
            -Dpackaging=pom -B
          echo "Parent POM stub installed"

      - name: Setup Visual Studio (rc.exe)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Upload fat jar
        uses: actions/upload-artifact@v4
        with:
          name: RocoMapTracker-sniffer-jar
          path: target/RocoMapTracker-sniffer-*.jar
          compression-level: 0

  native-image:
    name: Build native image
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: graalvm

      - name: Create Maven settings.xml for GitHub Packages
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ secrets.GH_PACKAGES_USER }}</username>
                <password>${{ secrets.GH_PACKAGES_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
          echo "=== settings.xml (password hidden) ==="
          sed 's/<password>.*<\/password>/<password>***<\/password>/' ~/.m2/settings.xml

      - name: Install parent POM stub (roco-map-tracker) to local repo
        shell: bash
        run: |
          cat > /tmp/roco-map-tracker-1.2.0.pom << 'POMEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>io.github.kedaya0209</groupId>
              <artifactId>roco-map-tracker</artifactId>
              <version>1.2.0</version>
              <packaging>pom</packaging>
          </project>
          POMEOF
          mvn install:install-file \
            -Dfile=/tmp/roco-map-tracker-1.2.0.pom \
            -DgroupId=io.github.kedaya0209 \
            -DartifactId=roco-map-tracker \
            -Dversion=1.2.0 \
            -Dpackaging=pom -B
          echo "Parent POM stub installed"

      - name: Setup Visual Studio (rc.exe + linker)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native image
        run: mvn native:compile -DskipTests -B -V

      - name: Upload native image
        uses: actions/upload-artifact@v4
        with:
          name: RocoMapTracker-sniffer.exe
          path: target/RocoMapTracker-sniffer.exe
          compression-level: 0

      - name: Upload native image to release
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const exePath = path.join(process.env.GITHUB_WORKSPACE, 'target', 'RocoMapTracker-sniffer.exe');
            if (!fs.existsSync(exePath)) {
              core.error('Native image not found at ' + exePath);
              process.exit(1);
            }
            const asset = await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              name: 'RocoMapTracker-sniffer.exe',
              data: fs.readFileSync(exePath),
            });
            core.info('Uploaded asset: ' + asset.data.name);