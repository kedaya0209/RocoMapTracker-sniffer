name: Build RocoMapTracker-sniffer

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-jar:
    name: Build fat jar
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: graalvm

      - name: Configure Maven for GitHub Packages
        shell: bash
        run: |
          mkdir -p ~/.m2
          echo '<?xml version="1.0" encoding="UTF-8"?>' > ~/.m2/settings.xml
          echo '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"' >> ~/.m2/settings.xml
          echo '  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"' >> ~/.m2/settings.xml
          echo '  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">' >> ~/.m2/settings.xml
          echo '  <servers>' >> ~/.m2/settings.xml
          echo '    <server>' >> ~/.m2/settings.xml
          echo '      <id>github</id>' >> ~/.m2/settings.xml
          echo "      <username>kedaya0209</username>" >> ~/.m2/settings.xml
          echo "      <password>${{ secrets.GH_PACKAGES_TOKEN }}</password>" >> ~/.m2/settings.xml
          echo '    </server>' >> ~/.m2/settings.xml
          echo '  </servers>' >> ~/.m2/settings.xml
          echo '</settings>' >> ~/.m2/settings.xml
          cat ~/.m2/settings.xml

      - name: Checkout RocoMapTracker (build roco-common from source)
        uses: actions/checkout@v4
        with:
          repository: kedaya0209/RocoMapTracker
          path: RocoMapTracker

      - name: Install roco-common to local Maven repo from source
        shell: bash
        run: |
          # 先安装根 POM（roco-map-tracker），-N = non-recursive
          mvn install -f RocoMapTracker/pom.xml -N -DskipTests -q
          # 再构建并安装 roco-common（含 a-m 自动解析父 POM）
          mvn install -f RocoMapTracker/pom.xml -pl roco-common -am -DskipTests -q
          echo "roco-common installed OK"

      - name: Setup Visual Studio (rc.exe)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Upload fat jar
        uses: actions/upload-artifact@v4
        with:
          name: RocoMapTracker-sniffer-jar
          path: target/RocoMapTracker-sniffer-*.jar
          compression-level: 0

  native-image:
    name: Build native image
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: graalvm

      - name: Configure Maven for GitHub Packages
        shell: bash
        run: |
          mkdir -p ~/.m2
          echo '<?xml version="1.0" encoding="UTF-8"?>' > ~/.m2/settings.xml
          echo '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"' >> ~/.m2/settings.xml
          echo '  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"' >> ~/.m2/settings.xml
          echo '  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">' >> ~/.m2/settings.xml
          echo '  <servers>' >> ~/.m2/settings.xml
          echo '    <server>' >> ~/.m2/settings.xml
          echo '      <id>github</id>' >> ~/.m2/settings.xml
          echo "      <username>kedaya0209</username>" >> ~/.m2/settings.xml
          echo "      <password>${{ secrets.GH_PACKAGES_TOKEN }}</password>" >> ~/.m2/settings.xml
          echo '    </server>' >> ~/.m2/settings.xml
          echo '  </servers>' >> ~/.m2/settings.xml
          echo '</settings>' >> ~/.m2/settings.xml
          cat ~/.m2/settings.xml

      - name: Checkout RocoMapTracker (build roco-common from source)
        uses: actions/checkout@v4
        with:
          repository: kedaya0209/RocoMapTracker
          path: RocoMapTracker

      - name: Install roco-common to local Maven repo from source
        shell: bash
        run: |
          # 先安装根 POM（roco-map-tracker），-N = non-recursive
          mvn install -f RocoMapTracker/pom.xml -N -DskipTests -q
          # 再构建并安装 roco-common（含 a-m 自动解析父 POM）
          mvn install -f RocoMapTracker/pom.xml -pl roco-common -am -DskipTests -q
          echo "roco-common installed OK"

      - name: Setup Visual Studio (rc.exe + linker)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native image
        run: mvn native:compile -DskipTests -B -V

      - name: Upload native image
        uses: actions/upload-artifact@v4
        with:
          name: RocoMapTracker-sniffer.exe
          path: target/RocoMapTracker-sniffer.exe
          compression-level: 0

      - name: Upload native image to release
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const exePath = path.join(process.env.GITHUB_WORKSPACE, 'target', 'RocoMapTracker-sniffer.exe');
            if (!fs.existsSync(exePath)) {
              core.error('Native image not found at ' + exePath);
              process.exit(1);
            }
            const asset = await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              name: 'RocoMapTracker-sniffer.exe',
              data: fs.readFileSync(exePath),
            });
            core.info('Uploaded asset: ' + asset.data.name);
