name: Build RocoMapTracker-sniffer

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-jar:
    name: Build fat jar
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: graalvm

      - name: Install roco-common to local Maven repo
        shell: bash
        run: |
          AUTH="kedaya0209:${{ secrets.GH_PACKAGES_TOKEN }}"
          BASE="https://maven.pkg.github.com/kedaya0209/RocoMapTracker"
          mkdir -p /tmp/roco-install

          # Download roco-common POM + JAR via curl（已验证 -L 跟随重定向正常）
          curl -fL -u "$AUTH" \
            "$BASE/io/github/kedaya0209/roco-common/1.2.0/roco-common-1.2.0.pom" \
            -o /tmp/roco-install/roco-common-1.2.0.pom
          curl -fL -u "$AUTH" \
            "$BASE/io/github/kedaya0209/roco-common/1.2.0/roco-common-1.2.0.jar" \
            -o /tmp/roco-install/roco-common-1.2.0.jar

          # 创建父 POM 桩（GitHub Packages 上没有部署它）
          cat > /tmp/roco-install/roco-map-tracker-1.2.0.pom << 'POMEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>io.github.kedaya0209</groupId>
              <artifactId>roco-map-tracker</artifactId>
              <version>1.2.0</version>
              <packaging>pom</packaging>
          </project>
          POMEOF
          mvn install:install-file \
            -Dfile=/tmp/roco-install/roco-map-tracker-1.2.0.pom \
            -DgroupId=io.github.kedaya0209 \
            -DartifactId=roco-map-tracker \
            -Dversion=1.2.0 \
            -Dpackaging=pom -B
          echo "Parent POM stub installed"

          # 安装 roco-common
          mvn install:install-file \
            -Dfile=/tmp/roco-install/roco-common-1.2.0.jar \
            -DpomFile=/tmp/roco-install/roco-common-1.2.0.pom \
            -B
          echo "roco-common installed"

          # 验证
          echo "=== roco-map-tracker ==="
          ls -la ~/.m2/repository/io/github/kedaya0209/roco-map-tracker/1.2.0/
          echo "=== roco-common ==="
          ls -la ~/.m2/repository/io/github/kedaya0209/roco-common/1.2.0/
          echo "=== _remote.repositories ==="
          cat ~/.m2/repository/io/github/kedaya0209/roco-common/1.2.0/_remote.repositories
          cat ~/.m2/repository/io/github/kedaya0209/roco-map-tracker/1.2.0/_remote.repositories
        run: mvn clean package -DskipTests -B

      - name: Upload fat jar
        uses: actions/upload-artifact@v4
        with:
          name: RocoMapTracker-sniffer-jar
          path: target/RocoMapTracker-sniffer-*.jar
          compression-level: 0

  native-image:
    name: Build native image
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: graalvm

      - name: Install roco-common to local Maven repo
        shell: bash
        run: |
          AUTH="kedaya0209:${{ secrets.GH_PACKAGES_TOKEN }}"
          BASE="https://maven.pkg.github.com/kedaya0209/RocoMapTracker"
          mkdir -p /tmp/roco-install

          curl -fL -u "$AUTH" \
            "$BASE/io/github/kedaya0209/roco-common/1.2.0/roco-common-1.2.0.pom" \
            -o /tmp/roco-install/roco-common-1.2.0.pom
          curl -fL -u "$AUTH" \
            "$BASE/io/github/kedaya0209/roco-common/1.2.0/roco-common-1.2.0.jar" \
            -o /tmp/roco-install/roco-common-1.2.0.jar

          cat > /tmp/roco-install/roco-map-tracker-1.2.0.pom << 'POMEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>io.github.kedaya0209</groupId>
              <artifactId>roco-map-tracker</artifactId>
              <version>1.2.0</version>
              <packaging>pom</packaging>
          </project>
          POMEOF
          mvn install:install-file \
            -Dfile=/tmp/roco-install/roco-map-tracker-1.2.0.pom \
            -DgroupId=io.github.kedaya0209 \
            -DartifactId=roco-map-tracker \
            -Dversion=1.2.0 \
            -Dpackaging=pom -B
          echo "Parent POM stub installed"

          mvn install:install-file \
            -Dfile=/tmp/roco-install/roco-common-1.2.0.jar \
            -DpomFile=/tmp/roco-install/roco-common-1.2.0.pom \
            -B
          echo "roco-common installed"

          echo "=== roco-map-tracker ==="
          ls -la ~/.m2/repository/io/github/kedaya0209/roco-map-tracker/1.2.0/
          echo "=== roco-common ==="
          ls -la ~/.m2/repository/io/github/kedaya0209/roco-common/1.2.0/
          echo "=== _remote.repositories ==="
          cat ~/.m2/repository/io/github/kedaya0209/roco-common/1.2.0/_remote.repositories
          cat ~/.m2/repository/io/github/kedaya0209/roco-map-tracker/1.2.0/_remote.repositories
        run: mvn native:compile -DskipTests -B -V

      - name: Upload native image
        uses: actions/upload-artifact@v4
        with:
          name: RocoMapTracker-sniffer.exe
          path: target/RocoMapTracker-sniffer.exe
          compression-level: 0

      - name: Upload native image to release
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const exePath = path.join(process.env.GITHUB_WORKSPACE, 'target', 'RocoMapTracker-sniffer.exe');
            if (!fs.existsSync(exePath)) {
              core.error('Native image not found at ' + exePath);
              process.exit(1);
            }
            const asset = await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              name: 'RocoMapTracker-sniffer.exe',
              data: fs.readFileSync(exePath),
            });
            core.info('Uploaded asset: ' + asset.data.name);
