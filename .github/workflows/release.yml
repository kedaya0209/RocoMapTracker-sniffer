name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-jar:
    name: Build fat jar
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: graalvm

      - name: Create Maven settings.xml for GitHub Packages
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ secrets.GH_PACKAGES_USER }}</username>
                <password>${{ secrets.GH_PACKAGES_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Install parent POM stub (roco-map-tracker)
        shell: bash
        run: |
          cat > /tmp/roco-map-tracker-1.2.0.pom << 'POMEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>io.github.kedaya0209</groupId>
              <artifactId>roco-map-tracker</artifactId>
              <version>1.2.0</version>
              <packaging>pom</packaging>
          </project>
          POMEOF
          mvn install:install-file \
            -Dfile=/tmp/roco-map-tracker-1.2.0.pom \
            -DgroupId=io.github.kedaya0209 \
            -DartifactId=roco-map-tracker \
            -Dversion=1.2.0 \
            -Dpackaging=pom -B

      - name: Setup Visual Studio (rc.exe)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build fat jar
        run: mvn clean package -DskipTests -B

      - name: Upload fat jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: RocoMapTracker-sniffer-jar
          path: target/RocoMapTracker-sniffer-*.jar
          compression-level: 0

  native-image:
    name: Build native image
    runs-on: windows-latest
    needs: build-jar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: graalvm

      - name: Create Maven settings.xml for GitHub Packages
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ secrets.GH_PACKAGES_USER }}</username>
                <password>${{ secrets.GH_PACKAGES_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Install parent POM stub (roco-map-tracker)
        shell: bash
        run: |
          cat > /tmp/roco-map-tracker-1.2.0.pom << 'POMEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>io.github.kedaya0209</groupId>
              <artifactId>roco-map-tracker</artifactId>
              <version>1.2.0</version>
              <packaging>pom</packaging>
          </project>
          POMEOF
          mvn install:install-file \
            -Dfile=/tmp/roco-map-tracker-1.2.0.pom \
            -DgroupId=io.github.kedaya0209 \
            -DartifactId=roco-map-tracker \
            -Dversion=1.2.0 \
            -Dpackaging=pom -B

      - name: Setup Visual Studio (rc.exe + linker)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native image
        run: mvn native:compile -DskipTests -B -V

      - name: Upload native image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: RocoMapTracker-sniffer-exe
          path: target/RocoMapTracker-sniffer.exe
          compression-level: 0

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-jar, native-image]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Debug artifacts
        shell: bash
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "PWD: $(pwd)"
          find . -name "*.jar" -o -name "*.exe" 2>/dev/null || echo "No artifacts found"

      - name: Create release (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -x
          TAG="${{ inputs.tag }}"
          JAR=$(ls RocoMapTracker-sniffer-jar/RocoMapTracker-sniffer-*.jar 2>/dev/null | head -1)
          EXE=RocoMapTracker-sniffer-exe/RocoMapTracker-sniffer.exe
          echo "JAR: $JAR, EXE exists: $([ -f "$EXE" ] && echo yes || echo no)"
          gh release create "$TAG" \
            --title "$TAG" \
            --draft \
            --generate-notes \
            "$JAR" \
            "$EXE"

      - name: Upload assets to existing release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -x
          TAG="${{ github.event.release.tag_name }}"
          JAR=$(ls RocoMapTracker-sniffer-jar/RocoMapTracker-sniffer-*.jar 2>/dev/null | head -1)
          EXE=RocoMapTracker-sniffer-exe/RocoMapTracker-sniffer.exe
          gh release upload "$TAG" "$JAR" "$EXE"
