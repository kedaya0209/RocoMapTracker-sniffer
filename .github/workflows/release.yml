name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release 版本号 (例如 1.0.0)'
        required: true
        type: string

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GraalVM JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: graalvm

      - name: Create Maven settings.xml for GitHub Packages
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ secrets.GH_PACKAGES_USER }}</username>
                <password>${{ secrets.GH_PACKAGES_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Install parent POM stub (roco-map-tracker)
        shell: bash
        run: |
          cat > /tmp/roco-map-tracker-1.2.0.pom << 'POMEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>io.github.kedaya0209</groupId>
              <artifactId>roco-map-tracker</artifactId>
              <version>1.2.0</version>
              <packaging>pom</packaging>
          </project>
          POMEOF
          mvn install:install-file \
            -Dfile=/tmp/roco-map-tracker-1.2.0.pom \
            -DgroupId=io.github.kedaya0209 \
            -DartifactId=roco-map-tracker \
            -Dversion=1.2.0 \
            -Dpackaging=pom -B

      - name: Setup Visual Studio (rc.exe)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build fat jar
        run: mvn clean package -DskipTests -B -V

      - name: Setup Visual Studio (rc.exe + linker)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native image
        run: mvn native:compile -DskipTests -B -V

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build rmt.db
        shell: bash
        run: |
          python build_db.py

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd target
          for f in RocoMapTracker-sniffer-*.jar RocoMapTracker-sniffer.exe; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "$f.sha256"
              echo "$f.sha256 generated"
            fi
          done
          cd ..
          if [ -f rmt.db ]; then
            sha256sum rmt.db > target/rmt.db.sha256
            echo "rmt.db.sha256 generated"
          fi

      - name: Get previous release tag
        id: prev_tag
        continue-on-error: true
        shell: bash
        run: |
          git fetch origin --tags --force 2>/dev/null || true
          PREV_TAG=$(git tag -l 'v*' | sort -V | grep -v -x "v${{ github.event.inputs.version }}" | tail -1)
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        run: |
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"
          if [ -z "$PREV_TAG" ]; then
            echo "首次发版，使用全部 commit 日志" >&2
            git log --no-merges --oneline --format="- %s" > releasenotes.md
          else
            echo "生成从 $PREV_TAG 到 HEAD 的 release notes" >&2
            git log "$PREV_TAG..HEAD" --no-merges --oneline --format="- %s" > releasenotes.md 2>/dev/null || {
              git log --no-merges --oneline --format="- %s" > releasenotes.md
            }
          fi
          echo "" >> releasenotes.md
          echo "**SHA256**: 见附件 \`.sha256\` 文件" >> releasenotes.md
          echo "" >> releasenotes.md
          echo "### 包含文件" >> releasenotes.md
          echo "- \`RocoMapTracker-sniffer.jar\` — fat jar" >> releasenotes.md
          echo "- \`RocoMapTracker-sniffer.exe\` — Windows native image" >> releasenotes.md
          echo "- \`rmt.db\` — 游戏数据 SQLite 数据库" >> releasenotes.md

      - name: Cleanup existing release and tag
        continue-on-error: true
        shell: bash
        run: |
          RAW="${{ github.event.inputs.version }}"
          RAW="${RAW#v}"
          TAG="v$RAW"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        shell: bash
        run: |
          RAW="${{ github.event.inputs.version }}"
          RAW="${RAW#v}"
          TAG="v$RAW"
          cd target
          JAR=$(ls RocoMapTracker-sniffer-*.jar 2>/dev/null | head -1)
          EXE=RocoMapTracker-sniffer.exe
          DB=../rmt.db
          JAR_SHA256="${JAR}.sha256"
          EXE_SHA256="${EXE}.sha256"
          DB_SHA256="rmt.db.sha256"

          ASSETS=()
          [ -f "$JAR" ] && ASSETS+=("../target/$JAR")
          [ -f "$EXE" ] && ASSETS+=("../target/$EXE")
          [ -f "$DB" ] && ASSETS+=("$DB")
          [ -f "$JAR_SHA256" ] && ASSETS+=("../target/$JAR_SHA256")
          [ -f "$EXE_SHA256" ] && ASSETS+=("../target/$EXE_SHA256")
          [ -f "../target/$DB_SHA256" ] && ASSETS+=("../target/$DB_SHA256")

          echo "Uploading assets: ${ASSETS[*]}"
          gh release create "$TAG" \
            "${ASSETS[@]}" \
            --title "$TAG" \
            --notes-file ../releasenotes.md
        env:
          GH_TOKEN: ${{ github.token }}
