name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release 版本号 (例如 1.0.0)'
        required: true
        type: string

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GraalVM JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: graalvm

      - name: Create Maven settings.xml for GitHub Packages
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ secrets.GH_PACKAGES_USER }}</username>
                <password>${{ secrets.GH_PACKAGES_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Install parent POM stub (roco-map-tracker)
        shell: bash
        run: |
          cat > /tmp/roco-map-tracker-1.2.0.pom << 'POMEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>io.github.kedaya0209</groupId>
              <artifactId>roco-map-tracker</artifactId>
              <version>1.2.0</version>
              <packaging>pom</packaging>
          </project>
          POMEOF
          mvn install:install-file \
            -Dfile=/tmp/roco-map-tracker-1.2.0.pom \
            -DgroupId=io.github.kedaya0209 \
            -DartifactId=roco-map-tracker \
            -Dversion=1.2.0 \
            -Dpackaging=pom -B

      - name: Setup Visual Studio (rc.exe)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build fat jar
        run: mvn clean package -DskipTests -B -V

      - name: Setup Visual Studio (rc.exe + linker)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native image
        run: mvn native:compile -DskipTests -B -V

      - name: Get latest data release tag
        id: data_tag
        continue-on-error: true
        shell: bash
        run: |
          git fetch origin --tags --force 2>/dev/null || true
          DATA_TAG=$(git tag -l 'data-v*' | sort -V | tail -1)
          echo "data_tag=$DATA_TAG" >> "$GITHUB_OUTPUT"
          echo "找到最新 data tag: $DATA_TAG"

      - name: Download rmt.db from data release
        if: steps.data_tag.outputs.data_tag != ''
        shell: bash
        run: |
          DATA_TAG="${{ steps.data_tag.outputs.data_tag }}"
          echo "从 $DATA_TAG 下载 rmt.db"
          gh release download "$DATA_TAG" --pattern "rmt.db" --dir target
          if [ -f target/rmt.db ]; then
            echo "rmt.db 下载成功 ($(stat -c%s target/rmt.db) bytes)"
          else
            echo "rmt.db 未找到，将跳过打包"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package plugin zip + metadata.json
        shell: bash
        run: |
          RAW="${{ github.event.inputs.version }}"
          RAW="${RAW#v}"
          VER="$RAW"
          ZIP_NAME="sniffer-v${VER}.zip"
          PKG_DIR="sniffer"

          mkdir -p "${PKG_DIR}"

          # 复制 exe
          if [ -f target/RocoMapTracker-sniffer.exe ]; then
            cp target/RocoMapTracker-sniffer.exe "${PKG_DIR}/"
          fi

          # 复制 rmt.db（如果有）
          if [ -f target/rmt.db ]; then
            cp target/rmt.db "${PKG_DIR}/"
          fi

          # 生成 metadata.json
          python scripts/gen_metadata.py "${VER}" "${PKG_DIR}"

          echo "--- metadata.json ---"
          cat "${PKG_DIR}/metadata.json"

          # 打包 zip (windows-latest 无 zip 命令，用 PowerShell Compress-Archive)
          pwsh -Command "Compress-Archive -Path \"${PKG_DIR}/*\" -DestinationPath \"${ZIP_NAME}\""
          mv "${ZIP_NAME}" target/
          echo "打包完成: target/${ZIP_NAME}"

      - name: Get previous release tag
        id: prev_tag
        continue-on-error: true
        shell: bash
        run: |
          git fetch origin --tags --force 2>/dev/null || true
          PREV_TAG=$(git tag -l 'v*' | sort -V | grep -v -x "v${{ github.event.inputs.version }}" | tail -1)
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        run: |
          RAW="${{ github.event.inputs.version }}"
          RAW="${RAW#v}"
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"
          if [ -z "$PREV_TAG" ]; then
            echo "首次发版，使用全部 commit 日志" >&2
            git log --no-merges --oneline --format="- %s" > releasenotes.md
          else
            echo "生成从 $PREV_TAG 到 HEAD 的 release notes" >&2
            git log "$PREV_TAG..HEAD" --no-merges --oneline --format="- %s" > releasenotes.md 2>/dev/null || {
              git log --no-merges --oneline --format="- %s" > releasenotes.md
            }
          fi
          echo "" >> releasenotes.md
          echo "### 下载说明" >> releasenotes.md
          echo "- \`sniffer-v${RAW}.zip\` — 插件包（exe + rmt.db + metadata.json），解压到 plugins/ 目录使用" >> releasenotes.md

      - name: Cleanup existing release and tag
        continue-on-error: true
        shell: bash
        run: |
          RAW="${{ github.event.inputs.version }}"
          RAW="${RAW#v}"
          TAG="v$RAW"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        shell: bash
        run: |
          RAW="${{ github.event.inputs.version }}"
          RAW="${RAW#v}"
          VER="$RAW"
          TAG="v${VER}"
          ZIP_NAME="sniffer-v${VER}.zip"

          ASSETS=()
          # 主产物：插件 zip
          if [ -f "target/${ZIP_NAME}" ]; then
            ASSETS+=("target/${ZIP_NAME}")
          fi
          # 独立 exe（直接下载用）
          if [ -f "target/RocoMapTracker-sniffer.exe" ]; then
            ASSETS+=("target/RocoMapTracker-sniffer.exe")
          fi

          echo "Uploading assets: ${ASSETS[*]}"
          gh release create "$TAG" \
            "${ASSETS[@]}" \
            --title "$TAG" \
            --notes-file releasenotes.md
        env:
          GH_TOKEN: ${{ github.token }}
